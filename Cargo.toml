[workspace]
resolver = "2"
members = [
    "crates/rotary-core",
    "crates/rotary-connectors",
    "crates/rotary-scanner",
    "crates/rotary-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rotaryoss/rotary"
homepage = "https://github.com/rotaryoss/rotary"
description = "Audit secret health across your vaults"

[workspace.dependencies]
rotary-core = { path = "crates/rotary-core" }
rotary-connectors = { path = "crates/rotary-connectors" }
rotary-scanner = { path = "crates/rotary-scanner" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
toml = "0.8"
